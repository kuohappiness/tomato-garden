<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe9a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="番茄園">
<title>番茄園讀書社</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffe9a8; --card:#fffdf5; --ink:#1d1d1d; --muted:#5e584c; --line:#1d1d1d;
  --tomato:#ff4b3e; --tomato-d:#d92d20; --leaf:#2fbf5b; --leaf-d:#168a3c; --leaf-l:#c9f5c4;
  --sky:#7fd3ff; --sun:#ffd23f; --purple:#8e5bb5; --radius:18px;
  --b:3px solid var(--ink); --sh:4px 4px 0 var(--ink);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5}
body{background:var(--bg) radial-gradient(rgba(0,0,0,.07) 1.2px,transparent 1.3px) 0 0/14px 14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.clock,.code,.lvl .num,.stat b{font-family:"Bungee","Noto Sans TC",sans-serif;font-weight:400}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(12px + var(--safe-t)) 14px calc(100px + var(--safe-b))}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:1.15rem;font-weight:900}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.75rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:var(--b);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--sh)}
.card.tilt{transform:rotate(-.6deg)}
.btn{border:var(--b);border-radius:14px;padding:10px 18px;font-weight:900;background:var(--leaf);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;box-shadow:var(--sh);text-shadow:0 1px 0 rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--tomato)}
.btn.yellow{background:var(--sun);color:var(--ink);text-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none}
.btn.soft{background:var(--leaf-l);color:var(--ink);text-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:5px 12px;min-height:36px;font-size:.88rem;box-shadow:3px 3px 0 var(--ink)}
.btn.big{font-size:1.15rem;min-height:56px}
.btn[disabled]{opacity:.5}
.iconbtn{border:0;background:transparent;padding:6px;border-radius:10px;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:var(--b);border-radius:12px;padding:10px 12px;background:#fff;min-height:46px;font-weight:500}
textarea{min-height:140px;resize:vertical;line-height:1.6}
label.f{display:block;font-size:.85rem;font-weight:700;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;border-radius:8px;padding:1px 8px;font-size:.78rem;font-weight:900;color:#fff;white-space:nowrap;border:2px solid var(--ink);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:4px 12px;font-size:.85rem;font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--ink);white-space:nowrap;flex:none}
.pill.on{background:var(--ink);color:#fff}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem}
.brand .logo{width:36px;height:40px;flex:none;display:inline-block}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--sun);display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:var(--ink);flex:none;overflow:hidden;border:2.5px solid var(--ink)}
.avatar.lg{width:48px;height:48px;font-size:1.15rem}
.countdown{background:var(--tomato);color:#fff;border:var(--b);border-radius:var(--radius);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:10px;box-shadow:var(--sh);transform:rotate(.5deg)}
.countdown b{font-family:"Bungee",sans-serif;font-weight:400;font-size:2rem;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);margin:0 4px}
.countdown .muted{color:#ffe1dc}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:var(--b);padding:6px 6px calc(6px + var(--safe-b));display:flex;justify-content:center;z-index:20}
.tabbar .in{max-width:560px;width:100%;display:flex;gap:4px}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:.72rem;color:var(--muted);font-weight:900;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink);background:var(--sun);border:2px solid var(--ink)}

.timer{text-align:center}
.timer .clock{font-size:3.6rem;letter-spacing:1px;line-height:1.05;-webkit-text-stroke:0}
.timer .mode{font-weight:900}
.timer.break{background:#d8f7ff}
.plantbox{width:170px;height:150px;margin:0 auto}
.goal{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.goal span{width:26px;height:26px}
.say{display:inline-block;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 12px;font-weight:700;position:relative;margin:6px 0 2px;font-size:.9rem}
.say::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}

.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:2px dashed #d8cfb8}
.task:first-child{border-top:0}
.check{width:28px;height:28px;border-radius:8px;border:2.5px solid var(--ink);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;padding:0}
.check.on{background:var(--leaf)}
.task .title{font-weight:700;word-break:break-word}
.task.done .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.stars{display:inline-flex;gap:2px;margin-top:2px}
.star{border:0;background:transparent;padding:2px;min-width:30px;min-height:30px;display:inline-flex;align-items:center;justify-content:center}
.star svg{width:22px;height:22px}
.datehead{font-weight:900;margin:8px 0 2px;display:flex;align-items:center;gap:8px}
.datehead.today{color:var(--tomato-d)}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-weight:700}

.bar{height:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat div{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:1.3rem;line-height:1.3}
.stat span{font-size:.72rem;font-weight:700;color:var(--muted)}

/* 軍團戰場 */
.field{position:relative;height:300px;border:var(--b);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh);margin:14px 0}
.field .sky{position:absolute;inset:0}
.field .hill{position:absolute;left:-10%;right:-10%;bottom:-40%;height:85%;border-radius:50% 50% 0 0;border-top:3px solid var(--ink)}
.field .title{position:absolute;left:12px;top:10px;font-weight:900;font-size:1.05rem;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:2px 10px;box-shadow:3px 3px 0 var(--ink);z-index:5}
.field .count{position:absolute;right:12px;top:10px;font-family:"Bungee",sans-serif;background:var(--sun);border:2.5px solid var(--ink);border-radius:10px;padding:0 10px;box-shadow:3px 3px 0 var(--ink);z-index:5}
.sol{position:absolute;border:0;background:transparent;padding:0;animation:walk var(--d) ease-in-out var(--dl) infinite alternate;z-index:2}
.sol>span{display:block;width:100%;height:100%;animation:bob .42s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@keyframes bob{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-5px) rotate(5deg)}}
.crate{position:absolute;border:0;background:transparent;padding:0;z-index:20;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.sprout{position:absolute;border:0;background:transparent;padding:0;z-index:3;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.cloud{position:absolute;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(640px)}}

.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dex .cell{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 4px 8px;text-align:center;font-size:.78rem;font-weight:900;position:relative}
.dex .cell .pic{width:64px;height:74px;margin:0 auto}
.dex .cell .n{position:absolute;right:6px;top:4px;font-family:"Bungee",sans-serif;font-weight:400;font-size:.8rem}
.dex .cell.lock{background:#eee6d2;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.badge{border-radius:12px;padding:8px 4px;text-align:center;background:#fff;border:2.5px solid var(--ink);font-size:.76rem;font-weight:900;line-height:1.3}
.badge .ic{font-size:1.6rem;display:block;line-height:1.3}
.badge .d{display:block;font-weight:500;font-size:.68rem;color:var(--muted)}
.badge.off{opacity:.38;filter:grayscale(1);border-style:dashed}
.lvl{display:flex;align-items:center;gap:12px}
.lvl .num{width:60px;height:60px;border-radius:16px;background:var(--tomato);color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;flex:none;border:var(--b);box-shadow:3px 3px 0 var(--ink);transform:rotate(-4deg)}

.friend{display:flex;gap:12px;align-items:flex-start}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:900;color:#fff;background:var(--tomato);border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
.code{font-size:1.6rem;letter-spacing:4px;background:var(--sun);border:var(--b);border-radius:12px;padding:2px 14px;box-shadow:3px 3px 0 var(--ink)}
.mini{display:flex;flex-wrap:wrap;gap:0;margin-top:6px}
.mini span{width:24px;height:28px;margin-right:-4px}
.quest{position:relative;height:150px;background:linear-gradient(#b8ecff,#e6f9ff 55%,#a6dc6c 55%);border:var(--b);border-radius:14px;overflow:hidden;margin-top:10px}
.quest .base{position:absolute;left:6px;bottom:6px;width:70px;height:78px}
.quest .boss{position:absolute;bottom:8px;width:96px;height:106px;transition:left 1s cubic-bezier(.3,1.4,.5,1)}
.quest .carry{position:absolute;bottom:2px;display:flex}
.quest .carry span{width:26px;height:30px;margin-right:-6px;animation:bob .3s ease-in-out infinite alternate}
.quest.tall{height:178px}
.quest .belt{position:absolute;left:44px;right:6px;bottom:6px;height:15px;border:3px solid var(--ink);border-radius:10px;background:repeating-linear-gradient(90deg,#5d646b 0 9px,#8a939b 9px 18px);animation:belt .5s linear infinite}
@keyframes belt{to{background-position:-18px 0}}
.quest .saw{position:absolute;left:0;bottom:0;width:62px;height:142px}
.quest .sign{position:absolute;left:50%;top:2px;width:132px;height:44px;transform:translateX(-50%);transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite}
.quest .say{position:absolute;left:58px;top:-14px;white-space:nowrap;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:1px 7px;font-size:.72rem;font-weight:900;box-shadow:2px 2px 0 var(--ink)}
.quest .trail{position:absolute;left:70px;right:10px;bottom:24px;border-bottom:3px dashed rgba(0,0,0,.35)}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:700;z-index:600;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;border:2px solid #fff}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,15,5,.55);display:flex;align-items:flex-end;justify-content:center;z-index:500}
.sheet{background:var(--card);width:100%;max-width:560px;border:var(--b);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe-b));max-height:90vh;overflow:auto}
.celebrate{text-align:center;padding:4px 0}
.celebrate .big{font-size:1.45rem;font-weight:900;margin-top:4px}
.celebrate .card-id{display:inline-block;font-family:"Bungee",sans-serif;background:var(--ink);color:var(--sun);border-radius:8px;padding:0 10px;font-size:.9rem}
.banner{background:#fff;border:2.5px dashed var(--ink);border-radius:12px;padding:8px 12px;font-size:.85rem;font-weight:700;margin-top:8px}
.login{min-height:84vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px}
.login h1{font-size:2.2rem;font-weight:900;transform:rotate(-2deg);text-shadow:3px 3px 0 var(--sun)}
.login .crowd{display:flex;justify-content:center;align-items:flex-end;height:130px}
.login .crowd span{width:70px;height:84px;margin:0 -8px;animation:bob .5s ease-in-out infinite alternate}
.login .crowd span:nth-child(2){width:96px;height:114px;animation-delay:.15s}
.login .crowd span:nth-child(3){animation-delay:.3s}
.seg{display:flex;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:900;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
.spin{width:30px;height:30px;border:4px solid #fff;border-top-color:var(--tomato);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scale(.3) translateY(40px);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:grow .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.shake{animation:shake .25s ease-in-out infinite}

.club{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;background:#fff;border:var(--b);border-radius:var(--radius);box-shadow:var(--sh);padding:10px;margin:14px 0;transition:transform .06s,box-shadow .06s}
.club:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.club .art{flex:0 0 112px;height:92px;border-radius:12px;border:2.5px solid var(--ink);background:var(--c);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.club .art span{width:44px;height:52px;margin:0 -7px -4px;animation:bob .5s ease-in-out infinite alternate}
.club .art span:nth-child(2){width:54px;height:64px;animation-delay:.15s}
.club .art span:nth-child(3){animation-delay:.3s}
.club .name{font-weight:900;font-size:1.2rem;line-height:1.2}
.club .meta{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:2px}
.club .go{align-self:center;font-weight:900;font-size:1.4rem}
.club.add{border-style:dashed;background:transparent;box-shadow:none;justify-content:center;align-items:center;min-height:84px;font-weight:900;font-size:1.05rem}
.tag{display:inline-block;font-size:.72rem;font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:0 6px;background:var(--sun);color:var(--ink)}
.hall-title{font-size:1.6rem;font-weight:900;transform:rotate(-1.5deg);display:inline-block;text-shadow:3px 3px 0 #fff;margin:6px 0 0}
.s67 .armL{animation:sx .32s ease-in-out infinite alternate}
.s67 .armR{animation:sx .32s ease-in-out infinite alternate-reverse}
.oath{text-align:center}
.oath-top{display:inline-block;background:var(--ink);color:var(--sun);border-radius:10px;padding:2px 12px;font-weight:900;font-size:.9rem}
.oath-stage{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:8px 0 2px}
.oath-stage .wc{width:52px;height:104px}
.oath-stage .wc:first-child{animation:bob .9s ease-in-out infinite alternate}
.oath-stage .wc:last-child{animation:bob .9s ease-in-out infinite alternate-reverse}
.oath-stage .god{width:120px;height:120px}
.oath .big{font-size:1.2rem;font-weight:900;margin:4px 0 8px}
.oath-text{background:#fffbea;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;line-height:1.65;font-size:1.02rem}
.oath-text p{margin:0}
.godwarn{display:flex;align-items:center;gap:10px;text-align:left;background:#fff3b0;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;margin:0 0 10px;box-shadow:3px 3px 0 var(--ink)}
.godwarn .gw-god{width:78px;height:78px;flex:none;animation:bob .9s ease-in-out infinite alternate}
.godwarn .gw-tag{display:inline-block;background:var(--ink);color:var(--sun);border-radius:8px;padding:0 8px;font-size:.75rem;font-weight:900}
.godwarn .gw-big{font-size:1.25rem;font-weight:900;color:#b3261e;margin-top:2px;line-height:1.25}
.godwarn .gw-small{font-size:.85rem;font-weight:700;line-height:1.4}
.oath-text .threat{margin-top:6px;background:#2a2140;color:#fff;border-radius:10px;padding:4px 8px;font-size:.92rem}
.oath-text .threat b{color:#ffd23f}
.oath-text .g-line{margin-top:6px;color:#b5341f}
.oath-text .six7-line{font-family:"Bungee",sans-serif,system-ui;font-size:1.1rem;margin-top:4px}
@keyframes sx{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes drop{0%{transform:translateY(-260px) rotate(-12deg)}70%{transform:translateY(12px) rotate(5deg)}100%{transform:translateY(0) rotate(0)}}
.drop{animation:drop 1s cubic-bezier(.3,1.2,.5,1)}
.giftbox{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.giftbox .g{background:#fff;border:2.5px solid var(--ink);border-radius:12px;text-align:center;padding:6px 2px;font-size:.66rem;font-weight:900;line-height:1.2;position:relative}
.giftbox .g .ic{font-size:1.6rem;display:block;line-height:1.3}
.giftbox .g .n{position:absolute;right:3px;top:1px;font-family:"Bungee",sans-serif;font-weight:400;font-size:.7rem}
.giftbox .g.off{background:#eee6d2;color:var(--muted)}
.giftbox .g.off .ic{filter:grayscale(1) brightness(.2);opacity:.25}
.rar{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:900;font-size:.8rem}
.r-普通{background:#fff}.r-少見{background:#c9f5c4}.r-稀有{background:#b9dcff}.r-傳說{background:linear-gradient(90deg,#ffd23f,#ff9a1f);}
.six7{font-family:"Bungee",sans-serif;font-size:2.4rem;color:var(--sun);-webkit-text-stroke:2px var(--ink);display:inline-block;animation:shake .3s infinite}
/* 被嵌在其他網頁（例如 Claude App 預覽）時：分頁列放上方，彈窗與提示放上方 */
body.embed #app{padding-bottom:40px}
body.embed .tabbar{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:var(--b);padding:6px;z-index:30}
body.embed .modal{align-items:flex-start}
body.embed .sheet{border-radius:0 0 22px 22px;border:var(--b);border-top:0;max-height:none}
body.embed .toast{top:80px;bottom:auto;position:absolute}

// 解析「11/16 英｜內容」這種格式
function parseLines(text, baseYear){
  const out=[]; const now=new Date();
  for (let raw of String(text).split(/\r?\n/)) {
    let line = raw.trim(); if (!line) continue;
    let date='';
    let m = line.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})\s*/);
    if (m) { date=`${m[1]}-${pad(m[2])}-${pad(m[3])}`; line=line.slice(m[0].length); }
    else if ((m = line.match(/^(\d{1,2})[/.](\d{1,2})(?:\s*[（(][^）)]*[）)])?\s*/))) {
      let y = baseYear || now.getFullYear();
      let d = `${y}-${pad(m[1])}-${pad(m[2])}`;
      if (!baseYear && (parseYmd(d) - now) < -200*86400000) d = `${y+1}-${pad(m[1])}-${pad(m[2])}`;
      date=d; line=line.slice(m[0].length);
    }
    let subject='其他';
    m = line.match(/^([^\s｜|:：]{1,4})\s*[｜|:：]\s*/) || line.match(/^(國文|英文|數學|生物|理化|歷史|地理|公民|社會|國|英|數|生|歷|地|公)\s+/);
    const names = (typeof S!=='undefined' && S.group) ? subjNames() : SUBJECTS.map(x=>x.name);
    m = m || line.match(/^([^\s｜|:：]{1,4})\s*[｜|:：]\s*/);
    if (m) {
      let hit = names.includes(m[1]) ? m[1] : ALIAS[m[1]];
      if (hit && !names.includes(hit)) { const SYN=[['國文','國語'],['英文','英語'],['生物','自然','理化'],['歷史','地理','公民','社會']];
        if (hit==='理化' && names.includes('超修')) hit='超修';
        else { const grp=SYN.find(g=>g.includes(hit)); const alt=grp?.find(x=>names.includes(x)); if(alt) hit=alt; } }
      if (!hit) { const c=names.filter(n=>n[0]===m[1][0]); if(c.length===1) hit=c[0]; }
      if (hit) { subject = names.includes(hit) ? hit : (names.includes('其他') ? '其他' : names.at(-1)); line=line.slice(m[0].length); }
    }
    if (!names.includes(subject)) subject = names.includes('其他') ? '其他' : names.at(-1);
    if (line) out.push({subject, title:line, date});
  }
  return out;
}

// 每 NEWS.length 天為一輪，每輪把全部新鮮事洗牌輪一次；指定日期的那則會被換到那一天，同一輪不會重複
function newsOrder(cyc){
  const L=NEWS.length, r=rng(hash('news'+cyc)), o=NEWS.map((_,i)=>i);
  for (let i=L-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; }
  const fixedPos=new Set();
  Object.entries(NEWS_FIXED).forEach(([d,id])=>{
    if (d<FX2_FROM) return; const days=daysBetween(FX2_FROM,d); if (Math.floor(days/L)!==cyc) return;
    const want=NEWS.findIndex(n=>n.id===id), pos=days%L, at=o.indexOf(want); if (want<0) return;
    [o[pos],o[at]]=[o[at],o[pos]]; fixedPos.add(pos);
  });
  if (cyc>0 && !fixedPos.has(0) && o[0]===newsOrder(cyc-1)[L-1]) { const k=fixedPos.has(1)?2:1; [o[0],o[k]]=[o[k],o[0]]; } // 不要連續兩天同一則
  return o;
}
function newsOf(d=ymd()){
  if (!d || d<FX2_FROM) return null;
  if (themeKey()==='boba' && d>='2026-11-22') return null; // 珍奶星球不放班級新鮮事（之前的收成不變）
  const days=daysBetween(FX2_FROM,d), L=NEWS.length;
  return NEWS[newsOrder(Math.floor(days/L))[days%L]];
}

  const nw=newsOf(so.date);
  if (nw?.fx?.harvest) return setSp(nw.fx.harvest, rng(hash(String(so.id)+'news')));
  if (so.rare || so.custom) return so;
  for (const ev of EGGS){

}

// 今天的班級新鮮事卡片（在「今天」頁）
function newsCard(){
  const today=ymd(), nw=newsOf(today); if (!nw) return '';
  const T_=TH(), mine=S.members[S.me.uid]?.poll;
  const myVote = mine && mine.d===today && mine.id===nw.id ? mine.v : -1;
  let fx='';
  if (nw.fx?.harvest) fx=`今天${T_.born}的全部都是${SPECIALS[nw.fx.harvest].name}！`;
  if (nw.fx?.gift) { const g=GIFTS.find(x=>x.id===nw.fx.gift); if(g) fx=`今天第一${T_.cnt}${T_.born}時，必掉 ${g.ic} ${esc(g.name)}！`; }
  let poll='';
  if (nw.poll) {
    const votes=[0,0]; Object.values(S.members||{}).forEach(m=>{ const p=m.poll; if(p&&p.d===today&&p.id===nw.id&&(p.v===0||p.v===1)) votes[p.v]++; });
    const tot=votes[0]+votes[1];
    poll=`<div class="row" style="gap:8px;margin-top:10px">${nw.poll.map((o,i)=>`<button class="btn ${myVote===i?'':'ghost'} grow sm" style="flex-direction:column;gap:0;min-height:52px;font-size:.85rem" data-a="vote" data-v="${i}">${esc(o)}${myVote>=0?`<span class="tiny" style="font-weight:700">${votes[i]} 票${tot?`・${Math.round(votes[i]/tot*100)}%`:''}</span>`:''}</button>`).join('')}</div>
      <p class="tiny" style="margin:6px 0 0">${myVote>=0?'可以改票，明天換新題目':'投票之後才看得到大家選什麼'}</p>`;
  }
  let rich='';
  if (nw.fx?.harvest==='orange') {
    const top=Object.entries(S.members||{}).filter(([,m])=>!m.bot).map(([u,m])=>[u,(m.dt||{})[today]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
    rich = top.length ? `<p class="small" style="margin:8px 0 0;font-weight:700">今日橘子富翁：${top.map(([u,n],i)=>`${['🥇','🥈','🥉'][i]} ${esc(memberName(u))} ${n} 顆`).join('　')}</p>`
                      : `<p class="small" style="margin:8px 0 0;font-weight:700">還沒有人拿到橘子，第一個橘子富翁就是你！</p>`;
  }
  return `<div class="card"><div class="row between"><h2>📢 班級新鮮事</h2><span class="small" style="font-weight:700">${fmtDate(today)}</span></div>
    <div class="row" style="gap:10px;align-items:flex-start;margin-top:6px"><span style="font-size:2.4rem;line-height:1">${nw.ic}</span>
    <div class="grow"><b>${esc(nw.title)}</b><p class="small" style="margin:2px 0 0">${esc(nw.story)}</p>${fx?`<p class="small" style="margin:6px 0 0;font-weight:900;color:var(--tomato-d)">${fx}</p>`:''}</div></div>
    ${poll}${rich}</div>`;
}

  const ms=ids.map(u=>raw[u]); let start='';

function botRefOn(d){                    // 真的社員在 d 這天平均讀幾顆（還沒加入的人不算）

  const ms=R.ms.filter(m=>!(typeof m.joinedAt==='number') || ymd(new Date(m.joinedAt))<=d);
  const v = ms.length ? ms.reduce((s,m)=>s+((m.dt||{})[d]||0),0)/ms.length : null;
  R.days.set(d, v); return v;

function botRefCum(d){                   // 真的社員平均在 d 以前一共讀了幾顆
  const R=botRefData(); if (!R.start || d<=R.start) return 0; if (R.cum.has(d)) return R.cum.get(d);
  let x=d; const stack=[]; while (x>R.start && !R.cum.has(x)) { stack.push(x); x=addDays(x,-1); }
  let c = x<=R.start ? 0 : R.cum.get(x);

  const tag=`<rect x="${isBig?20:26}" y="64" width="${isBig?60:48}" height="22" rx="7" fill="${isBig?'#ffd23f':'#fff'}" stroke="${k}" stroke-width="3"/><text x="50" y="81" text-anchor="middle" font-size="${isBig?17:16}" font-weight="900" fill="${k}" font-family="Bungee,sans-serif">×${count}</text>`;
  if (boba) return `<svg viewBox="0 0 100 105" width="100%" height="100%" aria-hidden="true">
    <path d="M60 16L74 -2" stroke="${k}" stroke-width="10" stroke-linecap="round"/><path d="M60 16L74 -2" stroke="#ff7aa2" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 18H86L78 100H22Z" fill="${isBig?'#f2c27a':'#e3b583'}" stroke="${k}" stroke-width="4" stroke-linejoin="round"/>
    ${[[30,50],[46,46],[62,52],[38,92],[54,94],[68,90],[28,92]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="#3b2416" stroke="${k}" stroke-width="1.5"/>`).join('')}
    <rect x="9" y="11" width="82" height="11" rx="4" fill="#fff" stroke="${k}" stroke-width="3"/>${isBig?`<path d="M24 32l3 -6 3 6" fill="none" stroke="${k}" stroke-width="2.5"/>`:''}${tag}</svg>`;
  const tom=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="13" fill="${c}" stroke="${k}" stroke-width="3"/><path d="M${x-6} ${y-11}l6 4 6-4" fill="#2fbf5b" stroke="${k}" stroke-width="2" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 100 105" width="100%" height="100%" aria-hidden="true">
    ${tom(30,30,'#ff4b3e')}${tom(70,30,isBig?'url(#gGoldC)':'#ff6a3d')}${tom(50,22,'#ff4b3e')}
    ${isBig?`<defs><linearGradient id="gGoldC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6b0"/><stop offset="1" stop-color="#e29600"/></linearGradient></defs>`:''}
    <rect x="8" y="36" width="84" height="64" rx="6" fill="${isBig?'#d18b45':'#c98a52'}" stroke="${k}" stroke-width="4"/>
    <path d="M8 56H92M8 78H92" stroke="${k}" stroke-width="2.5" opacity=".45"/>
    <path d="M14 40l72 56" stroke="${k}" stroke-width="2.5" opacity=".3"/>${tag}</svg>`;
}
function openCrate(i){
  const list=FIELD_BOXES[i]; if(!list) return;
  const T_=TH(), first=list[0], last=list[list.length-1];
  openModal(`<h2 style="margin:0 0 4px">${list.length>=100?'超大箱':list.length>=50?'大箱子':'一箱'}・${list.length} ${esc(T_.cnt)}${esc(T_.unit)}</h2>
    <p class="small" style="margin:0 0 10px">${first.n&&last.n?`No.${first.n}～No.${last.n}，`:''}${themeKey()==='boba'?'星球':'草地'}太擠了，早期的夥伴先裝箱休息。</p>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-height:50vh;overflow:auto">${list.map(so=>`<button data-a="soldier" data-id="${so.id}" style="border:0;background:transparent;padding:0;height:52px" aria-label="${esc(so.name||'')}">${soldierSVG(so)}</button>`).join('')}</div>
    <button class="btn ghost block" style="margin-top:10px" data-a="closeModal">關閉</button>`);
}

function skyNow(){
  const h=new Date().getHours();
  if (themeKey()==='boba') return (h>=6&&h<18) ? {sky:'linear-gradient(#c7b8ff,#ffd9ef)', hill:'#e9c597', night:false, sun:'#fff1a8'} : {sky:'linear-gradient(#2b2357,#5a3f8f)', hill:'#b98f60', night:true, sun:'#fff6c8'};
  if (h>=6 && h<16) return {sky:'linear-gradient(#69c9ff,#c9f1ff)', hill:'#78d453', night:false, sun:'#ffd23f'};
  if (h>=16 && h<19) return {sky:'linear-gradient(#ff8a4c,#ffd27a)', hill:'#65bf45', night:false, sun:'#ffef7a'};
  return {sky:'linear-gradient(#141a45,#3a4794)', hill:'#3b8a3f', night:true, sun:'#fff6c8'};
}
function fieldHTML(army, pluckTs, {title='', height=300}={}){
  title = title || TH().army;
  const sk=skyNow(), k=INK;
  const plucked=army.filter(s=>s.moon||s.endedAt<=pluckTs), sprouts=army.filter(s=>!s.moon&&s.endedAt>pluckTs);
  let deco = sk.night
    ? Array.from({length:14},(_,i)=>{ const r=rng(i+9); return `<span style="position:absolute;left:${r()*96}%;top:${r()*40}%;width:4px;height:4px;border-radius:50%;background:#fff;opacity:${.4+r()*.6}"></span>`; }).join('')
      + `<span style="position:absolute;right:18%;top:14%;width:34px;height:34px;border-radius:50%;background:${sk.sun};border:2.5px solid ${k};box-shadow:inset -9px -4px 0 rgba(0,0,0,.18)"></span>`
    : `<span style="position:absolute;right:16%;top:12%;width:40px;height:40px;border-radius:50%;background:${sk.sun};border:2.5px solid ${k}"></span>`
      + [0,1].map(i=>`<span class="cloud" style="top:${16+i*18}%;animation-duration:${38+i*17}s;animation-delay:-${i*20}s"><svg width="74" height="30" viewBox="0 0 74 30"><path d="M10 26a9 9 0 0 1 4-17a12 12 0 0 1 22-4a11 11 0 0 1 20 5a8 8 0 0 1 8 16z" fill="#fff" stroke="${k}" stroke-width="2.5"/></svg></span>`).join('');
  // 太多就裝箱：最新的 5～14 隻在草地上走，較早的按 100／50／10 隻一箱裝起來
  const n=plucked.length, boxedN = n<=14 ? 0 : Math.floor((n-5)/10)*10;
  const walkers=plucked.slice(boxedN);
  FIELD_BOXES = []; let at=0;
  for (const size of [100,50,10]) while (boxedN-at>=size){ FIELD_BOXES.push(plucked.slice(at,at+size)); at+=size; }
  const hillAt = x => 2.5 + 42.5*Math.sqrt(Math.max(0, 1-((x-50)/60)**2));   // 山丘表面高度（%）
  const nb=FIELD_BOXES.length, span=Math.min(80, nb*13), boxes=FIELD_BOXES.map((list,i)=>{
    const isBig=list.length>=50, w=list.length>=100?58:isBig?51:44, x = nb===1 ? 50 : 50-span/2+span*i/(nb-1);
    return `<button class="crate" data-a="crate" data-i="${i}" style="left:calc(${x.toFixed(1)}% - ${w/2}px);bottom:${(hillAt(x)-7).toFixed(1)}%;width:${w}px;height:${Math.round(w*1.05)}px;animation-delay:-${(i*.37).toFixed(2)}s" aria-label="${list.length} ${esc(TH().cnt)}${esc(TH().unit)}">${packSVG(list.length, isBig)}</button>`;
  }).join('');
  // 草地上的兵排成三排，每排平均分配位置，只在自己附近小範圍走動
  const rows=walkers.length<=4?1:walkers.length<=9?2:3, per=Math.ceil(walkers.length/rows);
  const sol = walkers.map((so,i)=>{
    const r=rng(so.seed+3), row=i%rows, col=Math.floor(i/rows), cnt=Math.min(per, Math.ceil((walkers.length-row)/rows));
    const y=(sprouts.length?8:0)+(rows===1?10:[5,14,23][row]+(rows===2?3:0))+r()*3, w=Math.round(46+(40-y)*0.45);
    const x=(rows===1?18:6+row*5)+ (cnt>1 ? col*((rows===1?60:70)/(cnt-1||1)) : 34) + (r()-.5)*5;
    const dx=Math.round((r()<.5?-1:1)*(8+r()*14)), d=(2.6+r()*3).toFixed(1), dl=(r()*4).toFixed(1);
    return `<button class="sol" data-a="soldier" data-id="${so.id}" style="left:${x.toFixed(1)}%;bottom:${y.toFixed(1)}%;width:${w}px;height:${Math.round(w*1.1)}px;z-index:${60-Math.round(y)};--dx:${dx}px;--d:${d}s;--dl:-${dl}s" aria-label="${so.name}"><span>${soldierSVG(so)}</span></button>`;
  }).join('');
  const spr = sprouts.slice(0,8).map((s,i)=>`<button class="sprout" data-a="pluck" style="left:${8+i*11}%;bottom:${2+(i%2)*6}%;width:48px;height:56px;z-index:70;animation-delay:-${i*.3}s" aria-label="${esc(TH().pluck)}">${themeKey()==='boba'?miniCupSVG():sproutSVG()}</button>`).join('');
  const emptyMsg = (!plucked.length && !sprouts.length) ? `<div style="position:absolute;left:50%;bottom:34%;transform:translateX(-50%);width:80%;text-align:center;z-index:6"><span class="say">${TH().empty}</span></div>` : '';
  return `<div class="field" style="height:${height}px">
    <div class="sky" style="background:${sk.sky}">${deco}</div>
    <div class="hill" style="background:${sk.hill}"></div>
    <div class="title">${esc(title)}</div><div class="count">×${plucked.length}</div>
    ${boxes}${sol}${spr}${emptyMsg}
    ${sprouts.length?`<div style="position:absolute;right:10px;bottom:10px;z-index:80"><span class="say" style="font-size:.8rem">${TH().pendingField(sprouts.length)}</span></div>`:''}
  </div>`;
}
// 朋友的小軍團（依各科讀書時間分配兵種）
function miniArmy(uid, max=14){
  const m=S.members[uid]||{}, n=uid===S.me?.uid ? myArmy().length : pearlTotal(m); if(!n) return `<span class="tiny muted">還沒有${TH().unit}</span>`;
  const sm=m.sm||{}, tot=Object.values(sm).reduce((a,b)=>a+b,0)||1;
  const show=Math.min(n,max), list=[];
  Object.entries(sm).sort((a,b)=>b[1]-a[1]).forEach(([s,v])=>{ for(let i=0;i<Math.round(v/tot*show);i++) list.push(s); });
  while(list.length<show) list.push('其他');
  return `<div class="mini">${list.slice(0,show).map((s,i)=>`<span>${soldierSVG({subject:s,seed:hash(uid+i)})}</span>`).join('')}${n>max?`<b class="small" style="align-self:center;margin-left:8px">+${n-max}</b>`:''}</div>`;
}

async function makeFirebaseAPI(cfg){
  const V='10.12.2', B=`https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp},A,F] = await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const {doc,collection,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,arrayUnion,arrayRemove,increment,serverTimestamp,query,where} = F;
  const gref = gid => doc(db,'groups',gid);
  return {
    mode:'firebase',
    onAuth(cb){ return A.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid, name:u.displayName||lsGet('tg-nick')||'同學', photo:u.photoURL||'', anon:u.isAnonymous, email:u.email||'', google:u.providerData.some(p=>p.providerId==='google.com')} : null)); },
    async signIn(){ const p=new A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'}); await A.signInWithPopup(auth,p); },
    async signInAnon(nick){ lsSet('tg-nick',nick); const c=await A.signInAnonymously(auth); try{ await A.updateProfile(c.user,{displayName:nick}); }catch{} },
    async emailSignUp(email,pw,nick){ lsSet('tg-nick',nick); const c=await A.createUserWithEmailAndPassword(auth,email,pw); try{ await A.updateProfile(c.user,{displayName:nick}); }catch{} },
    async emailSignIn(email,pw){ await A.signInWithEmailAndPassword(auth,email,pw); },
    async emailReset(email){ await A.sendPasswordResetEmail(auth,email); },
    async linkEmail(email,pw){ const cred=A.EmailAuthProvider.credential(email,pw); await A.linkWithCredential(auth.currentUser,cred); },
    // 把目前的帳號（免帳號或 Email）升級成 Google 帳號：uid 不變，番茄紀錄全部保留
    async linkGoogle(){ const p=new A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      try { const c=await A.linkWithPopup(auth.currentUser,p); await c.user.getIdToken(true); return {name:c.user.displayName, photo:c.user.photoURL||'', email:c.user.email||''}; }
      catch(err){ if(err.code==='auth/credential-already-in-use') this._usedCred=A.GoogleAuthProvider.credentialFromError(err); throw err; } },
    // 這個 Google 帳號已經是另一個番茄園帳號：直接改登入那個帳號
    async useLinkedGoogle(){ const c=this._usedCred; this._usedCred=null; if(c) await A.signInWithCredential(auth,c); else await this.signIn(); },
    signOut(){ return A.signOut(auth); },
    async getUser(uid){ const s=await getDoc(doc(db,'users',uid)); return s.exists()?s.data():null; },
    setUser(uid,data){ return setDoc(doc(db,'users',uid), data, {merge:true}); },
    async getGroup(gid){ const s=await getDoc(gref(gid)); return s.exists()?{id:s.id,...s.data()}:null; },
    async getMember(gid,uid){ const s=await getDoc(doc(db,'groups',gid,'members',uid)); return s.exists()?s.data():null; },
    async createGroup(me,{name,examName,examDate,theme='tomato'}){
      let code;
      for (let i=0;i<5;i++){ code=randCode(); const s=await getDoc(gref(code)); if(!s.exists()) break; }
      await setDoc(gref(code), {name, examName, examDate, theme, subjects:theme==='boba'?BOBA_SUBJECTS:SUBJECTS, owner:me.uid, members:[me.uid], createdAt:serverTimestamp()});
      await setDoc(doc(db,'groups',code,'members',me.uid), {name:me.name, photo:me.photo, joinedAt:Date.now()}, {merge:true});
      return code;
    },
    async joinGroup(me,code){
      code=code.trim().toUpperCase();
      const s=await getDoc(gref(code)); if(!s.exists()) throw new Error('找不到這個邀請碼');
      if ((s.data().banned||[]).includes(me.uid)) throw new Error('這個讀書社的團長已經封鎖你的帳號，不能加入');
      if (!(s.data().members||[]).includes(me.uid)) await updateDoc(gref(code), {members:arrayUnion(me.uid)});
      await setDoc(doc(db,'groups',code,'members',me.uid), {name:me.name, photo:me.photo, joinedAt:Date.now()}, {merge:true});
      return code;
    },
    async leaveGroup(me,gid){ await updateDoc(gref(gid), {members:arrayRemove(me.uid)}); },
    removeMember(gid,uid){ return updateDoc(gref(gid), {members:arrayRemove(uid)}); },
    banMember(gid,uid){ return updateDoc(gref(gid), {members:arrayRemove(uid), banned:arrayUnion(uid)}); },
    unbanMember(gid,uid){ return updateDoc(gref(gid), {banned:arrayRemove(uid)}); },
    // 每個人登入的 Google 信箱：只有團長讀得到，用來認出誰是誰
    setContact(gid,uid,data){ return setDoc(doc(db,'groups',gid,'contacts',uid), data); },
    watchContacts(gid,cb){ return onSnapshot(collection(db,'groups',gid,'contacts'), qs=>{ const o={}; qs.forEach(d=>o[d.id]=d.data()); cb(o); }, ()=>{}); },
    // 交棒：先刪掉舊團長登記的名錄（新團長的 App 會自動重新登記），再換團長
    async transferOwner(gid,uid,did){ if(did) await deleteDoc(doc(db,'directory',did)).catch(()=>{}); await updateDoc(gref(gid), {owner:uid, dirId:''}); },
    delDir(did){ return deleteDoc(doc(db,'directory',did)); },
    watchGroup(gid,cb,err){ return onSnapshot(gref(gid), s=>cb(s.exists()?{id:s.id,...s.data()}:null), err); },
    updateGroup(gid,data){ return updateDoc(gref(gid), data); },
    watchMembers(gid,cb,err){ return onSnapshot(collection(db,'groups',gid,'members'), qs=>{ const o={}; qs.forEach(d=>o[d.id]=d.data()); cb(o); }, err); },
    setMember(gid,uid,data){ return setDoc(doc(db,'groups',gid,'members',uid), data, {merge:true}); },
    startStudy(gid,uid,st){ return setDoc(doc(db,'groups',gid,'members',uid), {studying:{...st, startedAt:serverTimestamp()}}, {merge:true}); },
    // 我要去睡覺了：用伺服器時間記下按的時間（規則會檢查）
    markSleep(gid,uid,day){ return setDoc(doc(db,'groups',gid,'members',uid), {sleep:{[day]:serverTimestamp()}, sleepDay:day}, {merge:true}); },
    watchTasks(gid,cb,err){ return onSnapshot(collection(db,'groups',gid,'tasks'), qs=>{ const a=[]; qs.forEach(d=>a.push({id:d.id,...d.data()})); cb(a); }, err); },
    async addTasks(gid,uid,list){
      for (let i=0;i<list.length;i+=10){
        const b=writeBatch(db);
        list.slice(i,i+10).forEach((t,j)=>b.set(doc(collection(db,'groups',gid,'tasks')), {subject:t.subject,title:t.title,date:t.date||'',order:Date.now()+i+j,createdBy:uid}));
        await b.commit();
      }
    },
    updateTask(gid,id,data){ return updateDoc(doc(db,'groups',gid,'tasks',id), data); },
    deleteTask(gid,id){ return deleteDoc(doc(db,'groups',gid,'tasks',id)); },
    watchProgress(gid,cb,err){ return onSnapshot(collection(db,'groups',gid,'progress'), qs=>{ const o={}; qs.forEach(d=>o[d.id]=d.data()); cb(o); }, err); },
    setProgress(gid,uid,taskId,data){ return setDoc(doc(db,'groups',gid,'progress',`${uid}_${taskId}`), {uid,taskId,...data,updatedAt:Date.now()}, {merge:true}); },
    async recordSession(gid,uid,{subject,taskId,minutes,tomato}){
      const day=ymd(), b=writeBatch(db);
      b.set(doc(collection(db,'groups',gid,'sessions')), {uid,subject,taskId:taskId||'',minutes,tomato:!!tomato,date:day,endedAt:Date.now()});
      const up={minutes:increment(minutes), [`dm.${day}`]:increment(minutes), [`sm.${subject}`]:increment(minutes), studying:null};
      if (tomato){ up.tomatoes=increment(1); up[`dt.${day}`]=increment(1); }
      b.update(doc(db,'groups',gid,'members',uid), up);
      await b.commit();
    },
    watchSends(gid,cb){ return onSnapshot(collection(db,'groups',gid,'sends'), qs=>{ const a=[]; qs.forEach(d=>a.push({id:d.id,...d.data()})); cb(a); }, ()=>{}); },
    sendGift(gid,d){ return setDoc(doc(db,'groups',gid,'sends',`${d.from}_${d.date}`), d); },
    reactGift(gid,id,d){ return updateDoc(doc(db,'groups',gid,'sends',id), d); },
    watchChars(gid,cb){ return onSnapshot(collection(db,'groups',gid,'chars'), qs=>{ const a=[]; qs.forEach(d=>a.push({id:d.id,...d.data()})); cb(a); }, ()=>{}); },
    async addChar(gid,uid,data){ const ref=doc(db,'groups',gid,'chars',`${uid}_${weekStart()}`); const s=await getDoc(ref); if(s.exists()) throw new Error('week'); await setDoc(ref,{...data,by:uid,createdAt:Date.now()}); },
    deleteChar(gid,id){ return deleteDoc(doc(db,'groups',gid,'chars',id)); },
    bumpKetchup(gid,uid){ return updateDoc(doc(db,'groups',gid,'members',uid), {ketchup:increment(1), studying:null}); },
    async listDir(){ const qs=await getDocs(collection(db,'directory')); const a=[]; qs.forEach(d=>a.push({id:d.id,...d.data()})); return a; },
    setDir(did,data){ return setDoc(doc(db,'directory',did),data); },
    async getGuest(token){ const d=await getDoc(doc(db,'guests',token)); return d.exists()?d.data():null; },
    setGuest(token,data){ return setDoc(doc(db,'guests',token),data); },

const S = {
  api:null, me:null, userDoc:null, gid:null, group:null,
  members:{}, tasks:[], progress:{}, sessions:[],
  view:(location.hash.replace('#','')||'today'), loading:true, error:'',
  taskFilter:'全部', taskShowDone:true, friendSort:'week', addMode:'one',
  timer: lsGet('tg-timer'),
  settings: Object.assign({focus:25, brk:5, goal:4}, lsGet('tg-settings',{})),
};
if (!['today','tasks','garden','friends','settings'].includes(S.view)) S.view='today';
let unsubs=[];
const joinFromHash = (location.hash.match(/^#join-([A-Za-z0-9]{6})$/)||[])[1];
const guestFromHash = (location.hash.match(/^#guest-([A-Za-z0-9]{12})$/)||[])[1];

// ---------- 衍生資料 ----------
const isLeader = () => !!S.group && S.group.owner===S.me?.uid;
// 團長設定的最短專心時間（沒設定就是 5 分鐘）；實際使用的專心時間不會低於它
// 專心時間：個人設定 25 分鐘～3 小時（FOCUS_MIN～FOCUS_MAX）；團長的最短專心時間 5～180 分鐘
const FOCUS_MIN = 25, FOCUS_MAX = 180;
const clubMinFocus = () => { const v=parseInt(S.group?.minFocus); return v>=5&&v<=FOCUS_MAX ? v : 5; };
const myFocus = () => Math.min(FOCUS_MAX, Math.max(FOCUS_MIN, parseInt(S.settings.focus)||25));
const focusMin = () => Math.max(myFocus(), clubMinFocus());
const leaderName = () => (S.members[S.group?.owner]||{}).name || '團長';
const prog = (uid,tid) => S.progress[`${uid}_${tid}`] || {};
const sortTasks = a => [...a].sort((x,y)=> (x.date||'9999').localeCompare(y.date||'9999') || (x.order||0)-(y.order||0));
function memberStats(uid){
  const m=S.members[uid]||{}, today=ymd(), ws=weekStart();
  const dm=m.dm||{}, dt=m.dt||{};
  let week=0; for (let i=0;i<7;i++){ week += dm[addDays(ws,i)]||0; }
  let streak=0, d=today; if (!(dt[d]>0)) d=addDays(d,-1);
  while ((dt[d]||0)>0){ streak++; d=addDays(d,-1); }
  const tids=S.tasks.map(t=>t.id); let done=0, mast=0;
  tids.forEach(id=>{ const p=prog(uid,id); if(p.done) done++; mast+=p.mastery||0; });
  const maxDay=Math.max(0,...Object.values(dt));
  return { todayMin:dm[today]||0, todayTom:dt[today]||0, week, total:m.minutes||0, tomatoes:m.tomatoes||0, streak, maxDay,
    done, totalTasks:tids.length, donePct: tids.length? Math.round(done/tids.length*100):0,
    mastPct: tids.length? Math.round(mast/(3*tids.length)*100):0, sm:m.sm||{}, dt };
}
function subjectStats(uid){
  const by={};
  S.tasks.forEach(t=>{ const s=by[t.subject]=by[t.subject]||{total:0,done:0,mast:0}; const p=prog(uid,t.id); s.total++; if(p.done) s.done++; s.mast+=p.mastery||0; });
  const order=[...subjNames(), ...Object.keys(by).filter(n=>!subjNames().includes(n))];
  return order.filter(n=>by[n]).map(n=>({name:n,...by[n]}));
}
const levelOf = n => { const L=themeKey()==='boba'?BOBA_LEVELS:LEVELS; let i=0; L.forEach((l,k)=>{ if(n>=l.min) i=k; }); return {idx:i+1, ...L[i], next:L[i+1]}; };
const myName = () => S.members[S.me?.uid]?.name || S.me?.name || '我';
function avatar(uid, cls=''){
  const m=S.members[uid]||{}; const n=(m.name||'?').trim();
  if (m.bot && botOf(uid)) return botAvatar(botOf(uid), cls);
  return m.photo ? `<img class="avatar ${cls}" src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer">` : `<span class="avatar ${cls}">${esc(n.slice(0,1))}</span>`;
}

// ======================================================================
async function boot(){
  try {
    const cfg = window.FIREBASE_CONFIG;
    S.api = (cfg && cfg.apiKey) ? await makeFirebaseAPI(cfg) : makeLocalAPI();
  } catch(e) {
    console.error(e); S.error='無法載入 Firebase：'+(e.message||e)+'。請確認網路，或檢查 config.js。'; S.loading=false; render(); return;
  }
  if (guestFromHash) { startGuest(guestFromHash); return; }
  S.api.onAuth(afterAuth);
}
// 登入後：一定要是 Google 帳號才能進去（免帳號、Email 的舊帳號要先綁定 Google，紀錄會保留）
async function afterAuth(u){
    unsubs.forEach(f=>f()); unsubs=[];
    S.me=u; S.group=null; S.gid=null; S.members={}; S.rawMembers={}; S.tasks=[]; S.progress={};
    if (!u || !u.google) { S.loading=false; render(); return; }
    S.loading=true; render();
    try {
      S.userDoc = await S.api.getUser(u.uid) || {groups:[]};
      if (joinFromHash) { await doJoin(joinFromHash, true); history.replaceState(null,'',location.pathname); }
      else if (S.timer?.gid && (S.userDoc.groups||[]).includes(S.timer.gid)) subscribe(S.timer.gid);
      else { S.loading=false; loadHome(); render(); }
    } catch(e){ console.error(e); S.error=e.message; S.loading=false; render(); }
}
function goHome(){
  unsubs.forEach(f=>f()); unsubs=[];
  S.group=null; S.gid=null; S.loading=false; S.creating=false; S.view='today'; S.members={}; S.rawMembers={}; S.tasks=[]; S.progress={}; S.sessions=[]; S.chars=[]; S.rawChars=[]; S.sends=[]; S.rawSends=[];
  try{ history.replaceState(null,'',location.pathname); }catch{}
  loadHome(); render(); window.scrollTo(0,0);
}
async function loadHome(){
  const ids=S.userDoc?.groups||[];
  const out={};
  await Promise.all(ids.map(async gid=>{
    try { const g=await S.api.getGroup(gid); if(!g || !(g.members||[]).includes(S.me.uid)) return;
      const m=await S.api.getMember(gid,S.me.uid).catch(()=>null); out[gid]={g,m:m||{}}; } catch(e){ console.warn(gid,e); }
  }));
  S.home=out;
  await Promise.all(Object.entries(out).filter(([,x])=>x.g.owner===S.me.uid).map(([gid,x])=>ensureDir(gid,x.g).catch(e=>console.warn('dir',e))));
  try { S.dir=(await S.api.listDir()).sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant')); } catch(e){ console.warn('listDir',e); S.dir=[]; }
  S.homeLoaded=true; render();
}
// 讀書社名錄：團長的 App 會自動把讀書社名稱、角色、人數放上大廳（不含邀請碼）
let dirPub={};
async function ensureDir(gid,g){
  if (!S.api.setDir || g.owner!==S.me?.uid) return;
  let did=g.dirId;
  if (!did) { did=guestToken(); await S.api.updateGroup(gid,{dirId:did}); g.dirId=did; }
  const data={name:g.name||'', theme:g.theme||'tomato', n:(g.members||[]).length, by:S.me.uid};
  const key=did+JSON.stringify(data);
  if (dirPub[gid]===key) return;
  await S.api.setDir(did,{...data, updatedAt:Date.now()}); dirPub[gid]=key;
}
function subscribe(gid){
  unsubs.forEach(f=>f()); unsubs=[];
  S.gid=gid; S.loading=true; S.loaded={};
  const fail = e => { console.error(e); toast('讀取資料失敗：'+(e.code||e.message)); };
  const to=setTimeout(()=>{ if(S.loading){ S.loading=false; render(); } },10000);
  S.contacts={}; let watchingContacts=false;
  unsubs.push(S.api.watchGroup(gid, g=>{
    clearTimeout(to);
    if (!g || !(g.members||[]).includes(S.me.uid)) { goHome(); return; }
    S.group=g; S.loading=false;
    if (g.owner===S.me.uid && !watchingContacts && S.gid===gid) { watchingContacts=true; unsubs.push(S.api.watchContacts(gid, c=>{ S.contacts=c; render(); })); }
    render();
  }, fail));
  unsubs.push(S.api.watchMembers(gid, m=>{ S.rawMembers=m; botSync(); S.loaded.members=1; render(); }, fail));
  unsubs.push(S.api.watchTasks(gid, t=>{ S.tasks=t; render(); }, fail));
  unsubs.push(S.api.watchProgress(gid, p=>{ S.progress=p; render(); }, fail));
  unsubs.push(S.api.watchMySessions(gid, S.me.uid, s=>{ S.sessions=s; S.loaded.sessions=1; render(); }));
  unsubs.push(S.api.watchChars(gid, c=>{ S.rawChars=c; botSync(); S.loaded.chars=1; render(); }));
  unsubs.push(S.api.watchSends(gid, a=>{ S.rawSends=a; botSync(); S.loaded.sends=1; render(); }));
  // 確保自己的成員資料存在

let renderQueued=false;
function render(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false; doRender(); }); }
function doRender(){
  // 保留正在輸入的欄位
  const keep={}; document.querySelectorAll('[data-keep]').forEach(el=>{ keep[el.dataset.keep]=el.type==='checkbox'?el.checked:el.value; });
  const focusKey=document.activeElement?.dataset?.keep;
  if (S.group && !S.guest) botSync();
  const app=$('#app');
  if (S.error) app.innerHTML = `<div class="card"><h2>出了點問題</h2><p>${esc(S.error)}</p><button class="btn" data-a="reload">重新整理</button></div>`;
  else if (S.guest) app.innerHTML = viewGuest();
  else if (S.loading) app.innerHTML = `<div class="spin"></div>`;
  else if (!S.me) app.innerHTML = viewLogin();
  else if (!S.me.google) app.innerHTML = viewNeedGoogle();
  else if (!S.group) app.innerHTML = S.creating ? viewOnboard() : viewHome();
  else app.innerHTML = viewHeader() + ({today:viewToday,tasks:viewTasks,garden:viewGarden,friends:viewFriends,settings:viewSettings}[S.view]||viewToday)();
  document.querySelectorAll('[data-keep]').forEach(el=>{ const k=el.dataset.keep; if(k in keep){ if(el.type==='checkbox') el.checked=keep[k]; else el.value=keep[k]; } if(k===focusKey) el.focus(); });
  renderTabbar();
  tickTimer();
  scheduleGuestPublish();
  setTimeout(checkIncoming, 600);
  setTimeout(checkReplies, 900);
  setTimeout(checkDaily, 1200);
  setTimeout(checkBotJoin, 1500);
  setTimeout(checkSleepNote, 1800);
  if (S.group && S.gid && S.me && S.group.owner===S.me.uid) ensureDir(S.gid,{...S.group}).catch(e=>console.warn('dir',e));
}

function guestToken(){ const A='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; const r=crypto.getRandomValues(new Uint8Array(12)); r.forEach(b=>s+=A[b%A.length]); return s; }
const guestLink = t => `${location.origin}${location.pathname}#guest-${t}`;
function buildGuestSummary(){
  const g=S.group, uids=(g.members||[]).filter(u=>S.members[u]), ws=weekStart(), now=Date.now();
  let tom=0, min=0, weekTom=0, weekMin=0, todayMin=0, todayTom=0; const sm={}, lives=[];
  uids.forEach(u=>{ const st=memberStats(u), m=S.members[u];
    tom+=st.tomatoes; min+=st.total; weekMin+=st.week; todayMin+=st.todayMin; todayTom+=st.todayTom;
    for(let i=0;i<7;i++) weekTom+=(m.dt||{})[addDays(ws,i)]||0;
    Object.entries(st.sm).forEach(([k,v])=>sm[k]=(sm[k]||0)+v);
    if (m.studying && m.studying.endsAt>now) lives.push({subject:m.studying.subject||'', endsAt:m.studying.endsAt});
  });
  const by={};
  S.tasks.forEach(t=>{ const s=by[t.subject]=by[t.subject]||{total:0,done:0}; s.total++; uids.forEach(u=>{ if(prog(u,t.id).done) s.done++; }); });
  const order=[...subjNames(), ...Object.keys(by).filter(n=>!subjNames().includes(n))];
  const subj=order.filter(n=>by[n]).map(n=>({name:n, total:by[n].total, pct:uids.length?Math.round(by[n].done/(by[n].total*uids.length)*100):0}));
  return { gid:S.gid, name:g.name||'', theme:g.theme||'tomato', subjects:clubSubjects(), examName:g.examName||'', examDate:g.examDate||'',
    n:uids.length, tom, min, weekTom, weekMin, todayMin, todayTom, sm, lives, subj, week:ws };
}
let guestPub={timer:null, last:'', at:0};
function scheduleGuestPublish(force){
  const tok=S.group?.guestToken;
  if (!tok || !S.me || !S.gid || S.guest || !S.api?.setGuest) return;
  if (force) { guestPub.last=''; clearTimeout(guestPub.timer); guestPub.timer=null; }
  else if (guestPub.timer) return;
  const wait = force ? 300 : Math.max(3000, 30000-(Date.now()-guestPub.at));
  guestPub.timer=setTimeout(async()=>{ guestPub.timer=null;
    if (S.group?.guestToken!==tok) return;
    const sum=buildGuestSummary(), key=tok+JSON.stringify(sum);
    if (key===guestPub.last) return;
    try { await S.api.setGuest(tok,{...sum, updatedAt:Date.now()}); guestPub.last=key; guestPub.at=Date.now(); }
    catch(e){ console.warn('guest publish',e); }
  }, wait);
}
async function startGuest(token){

  await load(); setInterval(load, 60000);
}

let audioCtx=null;
function ensureAudio(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume?.(); }catch{} }
function chime(){
  try { if(!audioCtx) return; const t0=audioCtx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t0+i*.14); g.gain.linearRampToValueAtTime(.25,t0+i*.14+.02); g.gain.exponentialRampToValueAtTime(.001,t0+i*.14+.6); o.connect(g).connect(audioCtx.destination); o.start(t0+i*.14); o.stop(t0+i*.14+.65); });
  } catch {}
  try { navigator.vibrate?.([200,100,200]); } catch {}
}
let wakeLock=null;
async function keepAwake(on){ try{ if(on&&'wakeLock' in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener?.('release',()=>wakeLock=null); } else if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; } }catch{} }

async function startFocus(subject, taskId){
  ensureAudio();
  if (needOath()) { showOath(subject, taskId); return; }
  const dur=focusMin()*60000;
  S.timer={mode:'focus', startAt:Date.now(), dur, subject, taskId:taskId||'', gid:S.gid};
  saveTimer(); keepAwake(true); render();
  const task=S.tasks.find(t=>t.id===taskId);
  // 開始時間由伺服器記下，收成時伺服器會檢查真的專心滿最短時間才給番茄
  S.api.startStudy(S.gid,S.me.uid,{subject, title:task?.title||'', endsAt:S.timer.startAt+dur}).catch(()=>toast('沒連上網路，這次開始時間沒記到，可能不會算番茄'));
}
let finishing=false;
async function finishFocus(){
  if (finishing) return; finishing=true;
  const t=S.timer; const minutes=Math.round(t.dur/60000);
  // 伺服器以自己的時間檢查專心時間；網路慢一點時可能差幾秒被擋，就等一下再試
  for (let i=0;;i++){
    try { await S.api.recordSession(t.gid||S.gid, S.me.uid, {subject:t.subject, taskId:t.taskId, minutes, tomato:true}); break; }
    catch(e){
      console.error(e);
      if (e?.code==='permission-denied' && i<2){ await new Promise(r=>setTimeout(r,15000)); continue; }
      toast(e?.code==='permission-denied'?'伺服器認定這次沒有專心滿最短時間，這顆不算':'記錄失敗，請檢查網路'); break;
    }
  }
  chime();
  S.timer={mode:'break', startAt:Date.now(), dur:S.settings.brk*60000, gid:t.gid};
  saveTimer(); finishing=false; render();
  showCelebrate(t);
}
async function giveUp(){
  const t=S.timer; if(!t) return;
  const el=Date.now()-t.startAt, minutes=Math.floor(el/60000);
  S.timer=null; saveTimer(); keepAwake(false);
  const plant=$('#plant'); if(plant) plant.innerHTML=failArt();
  const gid=t.gid||S.gid;
  if (minutes>=5) await S.api.recordSession(gid,S.me.uid,{subject:t.subject,taskId:t.taskId,minutes,tomato:false}).catch(()=>{});
  await S.api.bumpKetchup(gid,S.me.uid).catch(()=>{});
  toast(minutes>=5?`${TH().failMsg}。不過 ${minutes} 分鐘有記錄下來`:TH().failMsg);
  setTimeout(render,1800);
}
function tickTimer(){
  const t=S.timer; const clock=$('#clock'), plant=$('#plant');
  if (!t || !S.me || !S.gid) return;
  const el=Date.now()-t.startAt, left=t.dur-el;
  if (t.mode==='focus' && left<=0) { finishFocus(); return; }
  if (t.mode==='break' && left<=0) { S.timer=null; saveTimer(); keepAwake(false); chime(); toast(TH().breakEnd); render(); return; }
  if (clock) clock.textContent=mmss(left);
  if (t.mode==='focus') { const sec=Math.ceil(left/1000), sl=$('#sayline');
    if (sec<=367 && sec>360) { if(sl && sl.dataset.six!=='1'){ sl.dataset.six='1'; sl.textContent=TH().six7; } plant?.classList.add('shake'); }
    else if (sl?.dataset.six==='1') { sl.dataset.six=''; sl.textContent='好，繼續專心'; plant?.classList.remove('shake'); } }
  if (plant && t.mode==='focus') {
    const p=el/t.dur, stage=Math.floor(p*60);
    if (plant.dataset.stage!==String(stage)) { plant.dataset.stage=stage; plant.innerHTML=growArt(Math.min(p,.99)); }
  }
  document.title = `${mmss(left)} ${t.mode==='focus'?'專心中':'休息'}・番茄園`;
}
setInterval(()=>{ if(S.timer) tickTimer(); else if(document.title!=='番茄園讀書社') document.title='番茄園讀書社'; },500);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ tickTimer(); if(S.timer) keepAwake(true); render(); } });

async function pluckAndShow(which='newest', taskId='', tries=0){
  const me=S.members[S.me.uid]||{}, ts=me.pluckTs||0;
  const army=myArmy(), waiting=army.filter(s=>!s.moon&&s.endedAt>ts);
  if (!waiting.length) { if (tries<8) return setTimeout(()=>pluckAndShow(which,taskId,tries+1),400); closeModal(); return toast(TH().none); }
  const so = which==='newest' ? waiting.at(-1) : waiting[0];

async function doJoin(code, fromHash=false){
  try {
    const gid=await S.api.joinGroup({...S.me, name:S.me.name}, code);
    const groups=[...new Set([...(S.userDoc.groups||[]),gid])];
    await S.api.setUser(S.me.uid,{groups,current:gid}); S.userDoc={...S.userDoc,groups,current:gid};
    S.creating=false; subscribe(gid); toast('加入成功！');
  } catch(e){ console.error(e); toast(e.message||'加入失敗'); if(fromHash){ S.loading=false; render(); } }
}
const val = id => ($('#'+id)?.value||'').trim();

document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, id=el.dataset.id;
  if (a==='closeModal' && e.target!==el && el.classList.contains('modal')) return;
  if (S.guest && !['closeModal','guestExit','reload'].includes(a)) return;
  try {
  switch(a){
    case 'reload': location.reload(); break;
    case 'guestExit': location.href=location.pathname; break;
    case 'guestOn': { if(!isLeader()) return toast('只有團長可以開啟');
      await S.api.updateGroup(S.gid,{guestToken:guestToken()}); scheduleGuestPublish(true); toast('訪客參觀開啟了，複製連結給家長吧'); break; }
    case 'guestReset': { if(!isLeader()) return; const old=S.group.guestToken;
      await S.api.updateGroup(S.gid,{guestToken:guestToken()}); if(old) S.api.delGuest(old).catch(()=>{}); scheduleGuestPublish(true); toast('已換新連結，舊連結失效'); break; }
    case 'guestOff': confirmBox('關閉訪客參觀？已經分享出去的連結會打不開。','guestOffOk'); break;
    case 'guestOffOk': { if(!isLeader()) return; const old=S.group.guestToken; closeModal();
      await S.api.updateGroup(S.gid,{guestToken:''}); if(old) await S.api.delGuest(old).catch(()=>{}); toast('訪客參觀已關閉'); break; }
    case 'closeModal': closeModal(); if (isBoba()) setTimeout(()=>{ checkBotJoin(); checkIncoming(); checkReplies(); checkSleepNote(); },900); break;
    case 'oathGo': { if(el.disabled) return; const p=S.oathPending; S.oathPending=null; lsSet(oathKey(),Date.now()); closeModal(); toast(`${oathGod().name}收到了，開始專心！`); if(p) await startFocus(p.subject,p.taskId); break; }
    case 'pluckNew': await pluckAndShow('newest', el.dataset.task||''); break;
    case 'pluck': await pluckAndShow('oldest'); break;
    case 'crate': openCrate(+el.dataset.i); break;
    case 'openGift': openGift(id, el.dataset.task||''); break;
    case 'subjEdit': if(!isLeader()) return toast('只有團長可以修改科目'); openSubjEdit(el.dataset.v); break;
    case 'charNew': openCharDesigner(); break;
    case 'noCharLater': lsSet(noCharKey(), ymd()); render(); break;
    case 'cdColor': S.draft.color=el.dataset.v; refreshDraft(); break;
    case 'cdAcc': S.draft.acc=el.dataset.v; refreshDraft(); break;
    case 'charSave': {
      const name=val('cd_name'); if(!name) return toast('幫角色取個名字吧');
      try { await S.api.addChar(S.gid,S.me.uid,{name, color:S.draft.color, acc:S.draft.acc, skill:val('cd_skill'), quote:val('cd_quote')}); closeModal(); toast(`「${name}」誕生了！`); }
      catch(e){ console.error(e); toast('這週已經設計過角色了，下週一再來'); } break;
    }
    case 'charDel': confirmBox('刪除這個角色？','charDelOk',`data-id="${id}"`); break;
    case 'charDelOk': await S.api.deleteChar(S.gid,id); closeModal(); toast('已刪除'); break;
    case 'pickColor': { $('#sj_color').value=el.dataset.v; document.querySelectorAll('#sj_colors .sw').forEach(b=>b.style.borderWidth=b.dataset.v===el.dataset.v?'4px':'2.5px'); break; }
    case 'subjSave': { if(!isLeader()) return toast('只有團長可以修改科目');
      const list=clubSubjects().map(x=>({...x})), idx=el.dataset.v, name=val('sj_name');
      if (!name) return toast('科目名稱不能空白');
      const dup=list.findIndex(x=>x.name===name); if (dup>=0 && String(dup)!==idx) return toast('已經有這個科目了');
      const item={name, color:$('#sj_color').value}; const unit=val('sj_unit'), skill=val('sj_skill'); if(unit) item.unit=unit; if(skill) item.skill=skill;
      if (idx==='new') { const oi=list.findIndex(x=>x.name==='其他'); if(oi>=0) list.splice(oi,0,item); else list.push(item); }
      else {
        const old=list[+idx].name; list[+idx]=item;
        if (old!==name) { const ts=S.tasks.filter(t=>t.subject===old); for(const t of ts) await S.api.updateTask(S.gid,t.id,{subject:name}); }
      }
      if (idx!=='new' && list[+idx]?.name!==SPORT.name && clubSubjects()[+idx]?.name===SPORT.name) list.push({name:SPORT.name, off:true});
      await S.api.updateGroup(S.gid,{subjects:subjWrite(list)}); closeModal(); toast('科目已儲存'); break;
    }
    case 'subjDel': { if(!isLeader()) return toast('只有團長可以修改科目');
      const i=+el.dataset.v, x=clubSubjects()[i], n=S.tasks.filter(t=>t.subject===x.name).length;
      confirmBox(`刪除「${esc(x.name)}」？${n?`<br><span class="small">已經有 ${n} 個任務用這科，任務會保留，只是科目選單裡不會再出現。</span>`:''}`,'subjDelOk',`data-v="${i}"`); break;
    }
    case 'subjDelOk': { if(!isLeader()) return toast('只有團長可以修改科目'); const gone=clubSubjects()[+el.dataset.v], list=clubSubjects().filter((_,i)=>i!==+el.dataset.v); if(!list.length) return toast('至少要留一科'); if(gone?.name===SPORT.name) list.push({name:SPORT.name, off:true}); await S.api.updateGroup(S.gid,{subjects:subjWrite(list)}); closeModal(); toast('已刪除'); break; }
    case 'subjUp': { if(!isLeader()) return toast('只有團長可以修改科目'); const i=+el.dataset.v; if(!i) break; const list=clubSubjects().map(x=>({...x})); [list[i-1],list[i]]=[list[i],list[i-1]]; await S.api.updateGroup(S.gid,{subjects:subjWrite(list)}); break; }
    case 'revealGift': revealGift(id, el.dataset.task||''); break;
    case 'giftInfo': { const g=giftDisp(GIFTS.find(x=>x.id===el.dataset.v)); const own=el.classList.contains('off')?0:1;
      if (own && giftable(g)) { openModal(`<div class="celebrate"><div style="font-size:4rem">${g.ic}</div><span class="rar r-${g.rar}">${g.cat?GIFT_CAT[g.cat]:g.rar}</span><div class="big">${esc(g.name)}</div><p style="font-weight:700">${esc(g.d)}</p>
        ${sentToday()?'<p class="small">今天已經送過禮物了，明天可以送這個給隊友。</p>':`<button class="btn red block" data-a="sendOpen" data-v="${g.id}">送給隊友</button>`}
        <button class="btn ghost block" style="margin-top:8px" data-a="closeModal">好</button></div>`); break; }
      openModal(`<div class="celebrate"><div style="font-size:4rem;${own?'':'filter:grayscale(1) brightness(.2);opacity:.3'}">${g.ic}</div><span class="rar r-${g.rar}">${g.rar}</span><div class="big">${own?esc(g.name):'？？？'}</div><p style="font-weight:700">${own?esc(g.d):'還沒拿到。繼續種番茄兵，說不定下一個空投就是它。'}</p><button class="btn yellow block" data-a="closeModal">好</button></div>`); break; }
    case 'sendOpen': closeModal(); openSend(el.dataset.v||''); break;
    case 'shopInfo': openShopItem(el.dataset.v); break;
    case 'shopBuy': await buyShopItem(el.dataset.v); break;
    case 'cdAccLock': { const x=SHOP.find(i=>i.id===el.dataset.v); if(x) toast(`先到花園的「番茄兌換所」用 ${x.p} ${TH().cnt}換「${x.name}」`); break; }
    case 'vote': { const nw=newsOf(); if(!nw?.poll) break; await S.api.setMember(S.gid,S.me.uid,{poll:{d:ymd(),id:nw.id,v:+el.dataset.v}}); break; }
    case 'sendPick': S.sendSel.item=el.dataset.v; document.querySelectorAll('#sendItems .g').forEach(b=>b.classList.toggle('on',b.dataset.v===S.sendSel.item)); break;
    case 'sendTo': S.sendSel.to=el.dataset.v; document.querySelectorAll('#sendTo .pill').forEach(b=>b.classList.toggle('on',b.dataset.v===S.sendSel.to)); break;
    case 'sendGo': { const sel=S.sendSel||{}; if(!sel.item) return toast('先選要送的寶物'); if(!sel.to) return toast('選一個隊友');
      if (sentToday()) { closeModal(); return toast('今天已經送過了，明天再來'); }
      if (!((giftInv()[sel.item]||0)>0)) return toast('你沒有這個寶物了');
      const msg=val('sendMsg').slice(0,30), to=(S.members[sel.to]||{}).name||'隊友';
      try { const b=botOf(sel.to);
        if (b) { await sendToBot(b, sel.item, msg); closeModal(); const a=botNow(b); toast(a&&(a.type==='bath'||a.type==='sleep')?`送給 ${to} 了！${to}${a.type==='bath'?'在洗澡':'睡著了'}，明天早上會回你`:`送給 ${to} 了！等一下${to}會回你`); }
        else { await S.api.sendGift(S.gid,{from:S.me.uid,to:sel.to,item:sel.item,msg,date:ymd(),ts:Date.now()}); closeModal(); toast(`送給 ${to} 了！`); } }
      catch(e){ console.error(e); toast(e.code==='permission-denied'?'今天已經送過了，明天再來':'送出失敗：'+(e.message||e.code)); } break; }
    case 'giftOpenIn': showIncoming(id); break;
    case 'giftReact': { const v=el.dataset.v, reply=cutReply(val('giftReply')); closeModal();
      try { await reactGift(id,{seen:true,re:v,...(reply?{reply}:{})}); } catch(e){ console.warn(e); if(reply) toast('回覆沒送出去，可以在禮物動態再回一次'); break; }
      toast(reply?'回覆送出了！':v==='eww'?'噁～已經回應了':v==='lol'?'哈哈，已經回應了':'已經跟對方說謝謝了'); showBotBack(id, v); break; }
    case 'giftReplyOpen': openReply(id); break;
    case 'sleepGo': await goSleep(); break;
    case 'giftReplyGo': { const reply=cutReply(val('giftReply')); if(!reply) return toast('先寫一句話');
      try { await reactGift(id,{reply}); closeModal(); toast('回覆送出了！'); showBotBack(id); }
      catch(e){ console.error(e); toast(e.code==='permission-denied'?'這個禮物已經回覆過了':'送出失敗：'+(e.message||e.code)); } break; }
    case 'soldier': { const so=myArmy(true).find(x=>x.id===id); if(so) soldierCard(so); break; }
    case 'signin': try{ await S.api.signIn(); }catch(err){ console.error(err); toast(err.code==='auth/popup-blocked'?'彈出視窗被擋住了，請允許後再試':err.code==='auth/unauthorized-domain'?'這個網址還沒加到 Firebase 授權網域（見 SETUP.md）':'登入失敗：'+(err.code||err.message)); } break;
    case 'signout':
      if (S.me?.anon) { confirmBox('免帳號登入的人登出後，<b>就再也回不到這個帳號</b>，紀錄也找不回來。<br>建議先到「設定」綁定 Google 帳號。確定要登出嗎？','signoutOk'); break; }
      if(S.timer) await giveUp(); await S.api.signOut(); break;
    case 'signoutOk': closeModal(); if(S.timer) await giveUp(); await S.api.signOut(); break;
    case 'emailStart': S.emailMode=el.dataset.v||S.emailMode||'in'; openEmailModal(); break;
    case 'emailGo': {
      const email=val('em_email'), pw=$('#em_pw').value, mode=S.emailMode;
      if (!email || !pw) return toast('請輸入 Email 和密碼');
      try {
        if (mode==='up') { const nick=val('em_nick'); if(!nick) return toast('請輸入暱稱'); if(pw.length<6) return toast('密碼至少 6 個字'); if(pw!==$('#em_pw2').value) return toast('兩次密碼不一樣'); closeModal(); await S.api.emailSignUp(email,pw,nick); }
        else { closeModal(); await S.api.emailSignIn(email,pw); }
      } catch(err){ console.error(err); toast(authMsg(err)); } break; }
    case 'emailReset': { const email=val('em_email'); if(!email) return toast('先在上面填 Email'); try{ await S.api.emailReset(email); toast('重設密碼的信寄出了，請到信箱收信（也看看垃圾郵件）'); }catch(err){ toast(authMsg(err)); } break; }
    case 'linkEmailStart': openModal(`<h2>綁定 Email＋密碼</h2>
      <p class="small" style="margin:6px 0">綁定後，換手機用這組 Email 和密碼登入，紀錄都還在。</p>
      <label class="f">Email</label><input type="text" id="lk_email" inputmode="email" autocomplete="email" placeholder="例如 學校信箱或家長信箱">
      <label class="f">設定密碼（至少 6 個字）</label><input type="password" id="lk_pw" autocomplete="new-password" style="width:100%;border:var(--b);border-radius:12px;padding:10px 12px;min-height:46px">
      <button class="btn block" style="margin-top:12px" data-a="linkEmailGo">綁定</button><button class="btn ghost block" style="margin-top:8px" data-a="closeModal">取消</button>`); break;
    case 'linkEmailGo': { const email=val('lk_email'), pw=$('#lk_pw').value; if(!email||pw.length<6) return toast('請填 Email，密碼至少 6 個字');
      try { await S.api.linkEmail(email,pw); closeModal(); S.me={...S.me, anon:false}; toast('綁定成功！換手機時用這組 Email 登入'); render(); } catch(err){ console.error(err); toast(authMsg(err)); } break; }
    case 'anonStart': openModal(`<h2>免帳號登入</h2>
      <p class="small" style="margin:6px 0 4px">輸入一個暱稱就能開始。朋友會看到這個名字。</p>
      <input type="text" id="anon_nick" maxlength="12" placeholder="例如：小宇">
      <div class="banner" style="margin-top:10px">注意：紀錄只會存在這支手機的這個瀏覽器。換手機或清除瀏覽器資料就找不回來。之後可以在「設定」綁定 Google 帳號保存紀錄。</div>
      <button class="btn red block" style="margin-top:12px" data-a="anonGo">開始</button>
      <button class="btn ghost block" style="margin-top:8px" data-a="closeModal">取消</button>`); setTimeout(()=>$('#anon_nick')?.focus(),50); break;
    case 'anonGo': { const n=val('anon_nick'); if(!n) return toast('請先輸入暱稱'); closeModal();
      try { await S.api.signInAnon(n); } catch(err){ console.error(err); toast(authMsg(err)); } break; }
    case 'linkGoogle': try {
        const r=await S.api.linkGoogle();
        toast('綁定成功！紀錄都保留了，之後換手機用這個 Google 帳號登入就好');
        await afterAuth({...S.me, anon:false, google:true, email:r.email||S.me.email, photo:r.photo||S.me.photo});
      } catch(err){ console.error(err);
        if (err.code==='auth/credential-already-in-use') { openModal(`<h2>這個 Google 帳號已經有番茄園帳號了</h2>
          <p class="small" style="margin:6px 0">你以前就用這個 Google 帳號登入過番茄園，所以不能再綁到現在這個帳號上。</p>
          <p class="small" style="margin:6px 0">可以直接改用那個 Google 帳號登入，但<b>現在這個${S.me.anon?'免帳號':''}帳號的紀錄不會帶過去</b>。想保留現在的紀錄，請換一個還沒用過的 Google 帳號綁定。</p>
          <button class="btn red block" style="margin-top:12px" data-a="useLinkedGoogle">改用那個 Google 帳號登入</button>
          <button class="btn ghost block" style="margin-top:8px" data-a="closeModal">換一個 Google 帳號</button>`); break; }
        toast(err.code==='auth/popup-blocked'?'彈出視窗被擋住了，請允許後再試':err.code==='auth/popup-closed-by-user'||err.code==='auth/cancelled-popup-request'?'沒有完成綁定，再按一次試試':err.code==='auth/unauthorized-domain'?'這個網址還沒加到 Firebase 授權網域（見 SETUP.md）':'綁定失敗：'+(err.code||err.message)); } break;
    case 'useLinkedGoogle': closeModal(); try { if(S.timer) await giveUp(); await S.api.useLinkedGoogle(); } catch(err){ console.error(err); toast(authMsg(err)); } break;
    case 'sportGo': { closeModal(); S.view='today'; history.replaceState(null,'','#today'); render(); window.scrollTo(0,0);
      const sel=$('#tsubj'); if (sel && [...sel.options].some(o=>o.value===SPORT.name)) { sel.value=SPORT.name; const tk=$('#ttask'); if(tk) tk.value=''; } break; }
    case 'dailyGo': closeModal(); S.view=el.dataset.v; history.replaceState(null,'','#'+S.view); render(); window.scrollTo(0,0); break;
    case 'go': S.view=el.dataset.v; history.replaceState(null,'','#'+S.view); render(); window.scrollTo(0,0); break;
    case 'join': { const c=val('joincode'); if(c.length!==6) return toast('邀請碼是 6 個字'); await doJoin(c); break; }
    case 'create': { if(!CREATE_OK) return toast('目前暫停建立新的讀書社');
      const name=val('gname')||`${myName()}的讀書小隊`;
      const gid=await S.api.createGroup(S.me,{name, examName:val('gexam'), examDate:val('gdate'), theme:$('#gtheme')?.value||'tomato'});
      const groups=[...new Set([...(S.userDoc.groups||[]),gid])];
      await S.api.setUser(S.me.uid,{groups,current:gid}); S.userDoc={...S.userDoc,groups,current:gid};
      S.creating=false; subscribe(gid); S.view='friends'; toast('讀書社建立好了，把邀請碼傳給朋友吧！'); break;
    }
    case 'start': { const subj=$('#tsubj').value, tid=$('#ttask').value; const task=S.tasks.find(x=>x.id===tid); await startFocus(task?.subject||subj, tid); break; }
    case 'startTask': { const task=S.tasks.find(x=>x.id===id); S.view='today'; history.replaceState(null,'','#today'); await startFocus(task.subject,id); window.scrollTo({top:0,behavior:'smooth'}); break; }
    case 'giveup': confirmBox(TH().failAsk,'confirmGiveup'); break;
    case 'confirmGiveup': closeModal(); await giveUp(); break;
    case 'skipbreak': S.timer=null; saveTimer(); keepAwake(false); render(); break;
    case 'toggle': { const p=prog(S.me.uid,id); await S.api.setProgress(S.gid,S.me.uid,id,{done:!p.done, mastery:p.mastery||(p.done?0:1)}); if(!p.done) toast('完成一項！記得幫熟練度打星星'); break; }
    case 'doneFromCelebrate': { const p=prog(S.me.uid,id); await S.api.setProgress(S.gid,S.me.uid,id,{done:true,mastery:p.mastery||1}); closeModal(); toast('打勾了！'); break; }
    case 'mast': { const p=prog(S.me.uid,id), n=+el.dataset.n; await S.api.setProgress(S.gid,S.me.uid,id,{mastery:(p.mastery===n?n-1:n)}); break; }
    case 'editTask': openEditTask(id); break;
    case 'saveTask': { const title=val('etitle'); if(!title) return toast('內容不能空白'); await S.api.updateTask(S.gid,id,{subject:$('#esubj').value,date:val('edate'),title}); closeModal(); break; }
    case 'delTask': confirmBox('確定刪除這個任務？大家的清單都會少這一項。','confirmDel',`data-id="${id}"`); break;
    case 'confirmDel': await S.api.deleteTask(S.gid,id); closeModal(); toast('已刪除'); break;
    case 'filter': S.taskFilter=el.dataset.v; render(); break;
    case 'addmode': S.addMode=el.dataset.v; render(); break;
    case 'addOne': { const title=val('ntitle'); if(!title) return toast('請輸入任務內容'); await S.api.addTasks(S.gid,S.me.uid,[{subject:$('#nsubj').value,title,date:val('ndate')}]); $('#ntitle').value=''; toast('新增了！'); break; }
    case 'addBulk': {
      const year = S.group.examDate ? +S.group.examDate.slice(0,4) : null;
      const list=parseLines($('#nbulk').value, year); if(!list.length) return toast('沒有讀到任務，檢查一下格式');
      el.disabled=true; await S.api.addTasks(S.gid,S.me.uid,list); $('#nbulk').value=''; toast(`加入了 ${list.length} 個任務`); break;
    }
    case 'template': confirmBox(`把「${TEMPLATE.name}」11/16–12/2 的 80 個任務加進這個群組？`,'confirmTemplate'); break;
    case 'confirmTemplate': { closeModal(); toast('加入中…'); await S.api.addTasks(S.gid,S.me.uid,parseLines(TEMPLATE.lines,2026)); if(!S.group.examDate) await S.api.updateGroup(S.gid,{examName:TEMPLATE.name,examDate:TEMPLATE.examDate}); toast('80 個任務加好了！'); break; }
    case 'fsort': S.friendSort=el.dataset.v; render(); break;
    case 'copy': { const v=el.dataset.v; try{ await navigator.clipboard.writeText(v); toast('已複製'); }catch{ openModal(`<p>請長按下面文字複製：</p><input type="text" value="${esc(v)}" onfocus="this.select()"><button class="btn block" style="margin-top:10px" data-a="closeModal">好</button>`); } break; }
    case 'saveName': { const n=val('sname'); if(!n) return; await S.api.setMember(S.gid,S.me.uid,{name:n}); toast('已儲存'); break; }
    case 'saveTimer': { const c=(id,lo,hi,d)=>Math.min(hi,Math.max(lo,parseInt(val(id))||d)); S.settings={focus:c('sfocus',FOCUS_MIN,FOCUS_MAX,25),brk:c('sbrk',1,30,5),goal:$('#sgoal')?c('sgoal',1,20,4):S.settings.goal}; lsSet('tg-settings',S.settings); toast('已儲存'); render(); break; }
    case 'saveGroup': await S.api.updateGroup(S.gid, isLeader() ? {name:val('sgname')||S.group.name, theme:$('#stheme')?.value||'tomato', minFocus:Math.min(FOCUS_MAX,Math.max(5,parseInt(val('sminfocus'))||clubMinFocus())), examName:val('sexam'), examDate:val('sedate')} : {examName:val('sexam'), examDate:val('sedate')}); toast('已儲存'); break;
    case 'home': case 'switchGroup': closeModal(); goHome(); break;
    case 'enter': { const g=el.dataset.v; await S.api.setUser(S.me.uid,{current:g}).catch(()=>{}); S.userDoc.current=g; S.view='today'; subscribe(g); window.scrollTo(0,0); break; }
    case 'newGroup': closeModal(); unsubs.forEach(f=>f()); unsubs=[]; S.group=null; S.gid=null; S.creating=true; render(); window.scrollTo(0,0); break;
    case 'leave': {
      if (isLeader() && otherMembers().length) { openModal(`<p style="font-weight:700">你是團長，要先把團長交給別人才能退出。</p><p class="small">在下面「成員管理」選一位隊友按「交棒」，之後就可以退出了。</p><button class="btn block" style="margin-top:12px" data-a="closeModal">知道了</button>`); break; }
      confirmBox(isLeader()?'你是這個讀書社唯一的成員，退出之後裡面就沒有人了。確定退出？':'確定退出這個讀書社？你的紀錄會留在群組裡，但你就看不到了。','confirmLeave'); break; }
    case 'confirmLeave': { closeModal(); const g=S.gid, did=isLeader()?S.group.dirId:''; await S.api.leaveGroup(S.me,g); if(did) S.api.delDir(did).catch(()=>{}); const groups=(S.userDoc.groups||[]).filter(x=>x!==g); await S.api.setUser(S.me.uid,{groups,current:''}); S.userDoc={...S.userDoc,groups,current:''}; goHome(); break; }
    case 'kick': { if(!isLeader()) return toast('只有團長可以移除成員'); const u=el.dataset.v;
      confirmBox(`把「${esc(memberName(u))}」移出讀書社？<br><span class="small">對方的讀書紀錄會留著；之後如果拿到邀請碼，還是可以再加入。</span>`,'kickOk',`data-v="${esc(u)}"`); break; }
    case 'ban': { if(!isLeader()) return toast('只有團長可以封鎖成員'); const u=el.dataset.v, c=(S.contacts||{})[u];
      confirmBox(`封鎖「${esc(memberName(u))}」？${c?.email?`<br><span class="small">${esc(c.email)}</span>`:''}<br><span class="small">對方會被移出讀書社，而且不能再用同一個帳號加入。之後可以在「已封鎖」解除。</span>`,'banOk',`data-v="${esc(u)}"`); break; }
    case 'banOk': { closeModal(); if(!isLeader()) return; const u=el.dataset.v, n=memberName(u); await S.api.banMember(S.gid,u); toast(`已經封鎖 ${n}`); break; }
    case 'unban': { if(!isLeader()) return; const u=el.dataset.v; await S.api.unbanMember(S.gid,u); toast(`已經解除封鎖 ${bannedName(u)}`); break; }
    case 'kickOk': { closeModal(); if(!isLeader()) return; const u=el.dataset.v, n=memberName(u); await S.api.removeMember(S.gid,u); toast(`已經把 ${n} 移出讀書社`); break; }
    case 'giveLead': { if(!isLeader()) return toast('只有團長可以交棒'); const u=el.dataset.v;
      confirmBox(`把團長交給「${esc(memberName(u))}」？<br><span class="small">交出去之後，讀書社名稱、角色、科目、訪客參觀和成員都改由對方管理，你會變成一般成員。</span>`,'giveLeadOk',`data-v="${esc(u)}"`); break; }
    case 'giveLeadOk': { closeModal(); if(!isLeader()) return; const u=el.dataset.v; if(!(S.group.members||[]).includes(u)) return toast('對方已經不在讀書社裡了'); await S.api.transferOwner(S.gid,u,S.group.dirId||''); toast(`${memberName(u)} 現在是團長了`); break; }
    case 'resetDemo': S.api.resetDemo(); toast('示範資料已重設'); break;
  }
  } catch(err){ console.error(err); toast('出錯了：'+(err.code||err.message)); }
});
document.addEventListener('input', e=>{
  if (!S.draft) return; const id=e.target.id;
  if (id==='cd_name') S.draft.name=e.target.value; if (id==='cd_skill') S.draft.skill=e.target.value; if (id==='cd_quote') S.draft.quote=e.target.value;
});
document.addEventListener('change', e=>{
  const el=e.target;
  if (el.dataset.a==='showdone'){ S.taskShowDone=el.checked; render(); }
  if (el.id==='ttask'){ const t=S.tasks.find(x=>x.id===el.value); if(t){ const s=$('#tsubj'); if(s) s.value=t.subject; } }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && e.target.id==='ntitle') { e.preventDefault(); document.querySelector('[data-a="addOne"]')?.click(); }
  if (e.key==='Enter' && e.target.id==='joincode') { e.preventDefault(); document.querySelector('[data-a="join"]')?.click(); }
});

// 回復中斷的番茄鐘（例如重新整理）
if (S.timer && S.timer.mode==='focus' && Date.now()-S.timer.startAt>S.timer.dur+6*3600000) { S.timer=null; saveTimer(); }

boot();
</script>
</body>
</html>
